<div id="popup-lang-switch" class="popup popup-language">
	<div class="popup__wrapper">
		<div class="popup__content">
			<button data-close type="button" class="popup__close popup-close _close-popup-button">
				<label class="popup-close__text">close</label>
			</button>
			<h3 class="popup-language__title main-title main-title_non-anim-scroll">Change language</h3>
			<div class="popup-language__block-buttons">
				<button type="button" class="popup-language__button button-lang-choose" data-lang="en">
					<span class="button-lang-choose__img">
						<img src="../img/flags/Flag-United-Kingdom.png" alt="Flag of United Kingdom">
					</span>
					<span class="button-lang-choose__text">English</span>
				</button>
				<button type="button" class="popup-language__button button-lang-choose" data-lang="ua">
					<span class="button-lang-choose__img">
						<img src="../img/flags/Flag-Ukraine.png" alt="Flag of Ukraine">
					</span>
					<span class="button-lang-choose__text">Ukrainian</span>
				</button>
				<button type="button" class="popup-language__button button-lang-choose" data-lang="ru">
					<span class="button-lang-choose__img">
						<img src="../img/flags/Flag-Russian.png" alt="Flag of Free Russia">
					</span>
					<span class="button-lang-choose__text">Russian</span>
				</button>
			</div>
		</div>
	</div>
</div>
